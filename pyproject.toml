[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helpme-green"
dynamic = ["version"]
description = "Circular-economy AI-backed R&D assistant with source-aware reference retrieval"
requires-python = ">=3.11"
dependencies = [
  "cryptography==46.0.3",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]
release = [
  "build>=1.2",
  "pyinstaller>=6.0",
]

[project.scripts]
helpme-green = "helpme_green.cli:main"
helpme-green-ingest = "helpme_green.ingest_cli:main"
helpme-green-knowledge-loop = "helpme_green.knowledge_loop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "helpme_green.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["helpme_green"]
ignore_missing_imports = true
