schema_version: "0.3"
kind: routes
cards:
  - id: mixed-metal-physical-sorting-v03
    business_id: KMI-ROU-MIX-METAL-V03
    version: 3
    title: Characterise and physically sort mixed metals
    description: >-
      Discovery route from risk-based inspection and dangerous-item removal through optional
      liberation, size classification, magnetic separation, non-ferrous separation, output
      qualification, and buyer acceptance. No feed-specific yield or economics are asserted.
    maturity: COMMERCIAL
    evidence_class: ESTABLISHED
    method_class: PHYSICAL_SEPARATION
    comparison_role: ALTERNATIVE
    cost_model_coverage: UNKNOWN
    requires_partner: true
    jurisdiction_scope: European Union; Bulgarian authorization and permit applicability require qualified review.
    sources:
      - &eu_bat
        id: eu-waste-treatment-bat-2018
        source_type: REGULATION
        publisher: European Commission
        title: Commission Implementing Decision (EU) 2018/1147 on BAT conclusions for waste treatment
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02018D1147-20180817
        published_on: "2018-08-17"
        accessed_on: "2026-07-14"
        geography: European Union
        jurisdiction: European Union
        location_reference: Annex, BAT 2 and sections 2.1 to 2.3
        limitations: >-
          Applies only to activities and installations within its legal and technical scope.
          Site-specific permit conditions and applicability require qualified review.
        confidence: HIGH
    claims:
      - key: route-basis
        claim_type: READINESS
        statement: >-
          Mixed-metal treatment is only a candidate until feed composition, dangerous items,
          liberation needs, and the intended output acceptance basis are established.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: Mixed metal waste considered for mechanical treatment or sorting.
        limitations: Does not establish recovery, purity, scale suitability, or value for a specific feed.
        conflicting_evidence: Actual feed and facility capability may change route relevance.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(a), BAT 2(b), and BAT 26(a) to BAT 26(c)
            feed_composition: Mixed metal waste
            feed_condition: Before acceptance and mechanical treatment
            physical_form: Loose, baled, or partly processed metal waste
            particle_size: Feed-specific and not transferred
            contamination: Dangerous and non-depolluted items may be present
            pretreatment: Inspection and removal of dangerous items
            equipment_configuration: Mechanical treatment and sorting classes only
            scale_and_throughput: Within applicable installation scope; no throughput transfer
            measurement_method: Risk-based characterisation and documented inspection
            output_definition: Candidate ferrous, non-ferrous, and residue fractions
            applicability: Supports discovery gates and a high-level chain.
            limitations: No numeric performance, commercial terms, or site approval is supplied.
            conflicting_evidence: None recorded for the limited BAT requirements.
      - key: qualification-basis
        claim_type: OUTPUT
        statement: >-
          Each separated fraction requires measured mass, contamination evidence, and written
          receiver criteria before it can support a commercial or financial conclusion.
        evidence_state: SCREENED
        confidence: HIGH
        applicability: Outputs from mixed-metal physical separation.
        limitations: Receiver specifications and prices are external evidence gaps.
        conflicting_evidence: Receiver acceptance can differ by facility and contract.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(c), output quality management system
            feed_composition: Waste-treatment outputs
            feed_condition: After treatment
            physical_form: Separated output and residue fractions
            particle_size: Output-specific
            contamination: Output quality parameters must be relevant to downstream treatment
            pretreatment: Route-specific
            equipment_configuration: Not specified
            scale_and_throughput: Not transferred
            measurement_method: Output analysis and tracking
            output_definition: Fraction assessed against downstream treatment expectations
            applicability: Supports output qualification and receiver-evidence gates.
            limitations: Does not define a buyer grade or product status.
            conflicting_evidence: None recorded for the limited management requirement.
    chains:
      - key: mixed-metal-sort-chain
        title: Mixed-metal physical sorting chain
        description: High-level advisory chain; equipment selection and operation require specialist design.
        steps:
          - key: inspect
            sequence: 10
            operation_class: INSPECTION
            title: Characterise and remove dangerous items
            description: Establish input envelope and safe eligibility.
            equipment_classes: [Inspection and controlled receiving area]
            capability_classes: [Waste characterisation, hazardous-item recognition]
          - key: liberate-classify
            predecessor_key: inspect
            sequence: 20
            operation_class: LIBERATION
            title: Optional liberation and size classification
            description: Use only where representative evidence supports a need and capability.
            equipment_classes: [Purpose-designed liberation and screening classes]
            capability_classes: [Mechanical processing, dust and incident control]
          - key: separate
            predecessor_key: liberate-classify
            sequence: 30
            operation_class: PHYSICAL_SEPARATION
            title: Ferrous and non-ferrous physical separation
            description: Separate candidate fractions for measurement and qualification.
            equipment_classes: [Magnetic and non-ferrous separator classes]
            capability_classes: [Physical separation, output quality control]
          - key: qualify
            predecessor_key: separate
            sequence: 40
            operation_class: QUALIFICATION
            title: Qualify outputs and residues
            description: Close mass balance and obtain written receiver acceptance.
            equipment_classes: [Sampling, weighing, and inspection systems]
            capability_classes: [Mass balance, specification and buyer review]
    requirements:
      - key: material-family-match
        dimension: MATERIAL_IDENTIFICATION
        predicate:
          fact_key: suspected_material
          operator: NORMALIZED_IN
          value: [mixed metals, mixed metal, mixed ferrous and non-ferrous metals, mixed ferrous and nonferrous metals]
        minimum_evidence_state: HEARSAY
        unknown_policy: PRELIMINARY
        failed_policy: NOT_RELEVANT
        blocking_scope: Route applicability only
        claim_key: route-basis
      - key: representative-characterisation
        dimension: TECHNICAL
        predicate: {fact_key: mixed_metal_characterisation, operator: EQUALS, value: COMPLETE}
        minimum_evidence_state: SCREENED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Technical and decision readiness
        claim_key: route-basis
      - key: qualified-safety-legal-review
        dimension: SAFETY_LEGAL
        predicate: {fact_key: mixed_metal_safety_legal, operator: EQUALS, value: CLEARED}
        minimum_evidence_state: VERIFIED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Processing and decision readiness
        claim_key: route-basis
      - key: written-buyer-acceptance
        dimension: OUTPUT_BUYER
        predicate: {fact_key: mixed_metal_buyer, operator: EQUALS, value: CONFIRMED}
        minimum_evidence_state: VERIFIED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Output and buyer readiness
        claim_key: qualification-basis
      - key: complete-commercial-scope
        dimension: FINANCIAL
        predicate: {fact_key: mixed_metal_commercial, operator: EQUALS, value: COMPLETE}
        minimum_evidence_state: VERIFIED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Financial and decision readiness
        claim_key: qualification-basis
    outcomes:
      - key: qualified-metal-fractions
        name: Buyer-qualified ferrous and non-ferrous fractions
        role: OUTPUT
        yield_status: UNKNOWN
        physical_form: Separated metal fractions
        specification: Receiver-specific; no default grade is asserted.
        applications: [Authorized downstream metal recovery]
        buyer_constraints: [Written specification, sampling, deductions, and rejection terms required]
        mass_balance_role: Measured output fractions
        claim_key: qualification-basis
      - key: mixed-metal-residue
        name: Nonconforming and residual fraction
        role: RESIDUE
        yield_status: UNKNOWN
        physical_form: Unseparated fines, non-metals, and rejected items
        specification: Lawful destination and acceptance criteria required.
        applications: [Further authorised assessment or treatment]
        buyer_constraints: [No value or recovery route is assumed]
        mass_balance_role: Measured residue and liability fraction
        claim_key: qualification-basis
    performance_estimates: []
    cost_estimates: []
    failure_modes:
      - key: dangerous-item-or-poor-liberation
        title: Dangerous item entry or insufficient liberation
        causes: [Incomplete inspection, unrecognised attached components, unsuitable liberation basis]
        consequences: [Incident risk, cross-contaminated outputs, rejection, excess residue]
        detection_evidence: [Documented inspection, representative screen, output contamination results]
        mitigation_class: Qualified input control and representative process assessment
        claim_key: route-basis
    guided_questions:
      - key: mixed-metal-characterisation-question
        prompt: Has representative composition, size, attachment, and contamination evidence been recorded?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: SCREENED
        acquisition_cost_class: LABORATORY
        delay_class: DAYS
        requirement_keys: [representative-characterisation]
      - key: mixed-metal-safety-question
        prompt: Has a qualified safety, waste-status, authorization, and destination review cleared this route?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: VERIFIED
        acquisition_cost_class: HIGH
        delay_class: WEEKS
        requirement_keys: [qualified-safety-legal-review]
      - key: mixed-metal-buyer-question
        prompt: Has the intended receiver confirmed the output specification and acceptance terms in writing?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: VERIFIED
        acquisition_cost_class: QUOTATION
        delay_class: WEEKS
        requirement_keys: [written-buyer-acceptance]
      - key: mixed-metal-commercial-question
        prompt: Are all mass-balance, processing, logistics, residue, price, deduction, and rejection terms evidenced?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: VERIFIED
        acquisition_cost_class: QUOTATION
        delay_class: WEEKS
        requirement_keys: [complete-commercial-scope]
    knowledge_gaps:
      - key: representative-mixed-metal-screen
        description: Feed-specific composition, attachment, size, and contamination evidence is unavailable.
        affected_dimensions: [MATERIAL_IDENTIFICATION, TECHNICAL]
        affected_route_keys: [KMI-ROU-MIX-METAL-V03]
        acquisition_action: Obtain representative inspection, mass, composition, and liberation evidence.
        acquisition_cost_class: LABORATORY
        delay_class: DAYS
        priority: HIGH
        review_domain: Materials and process engineering
      - key: qualified-mixed-metal-review
        description: Legal, safety, authorization, and destination applicability remain unresolved.
        affected_dimensions: [SAFETY_LEGAL]
        affected_route_keys: [KMI-ROU-MIX-METAL-V03]
        acquisition_action: Obtain qualified safety and environmental review for the intended route and site.
        acquisition_cost_class: HIGH
        delay_class: WEEKS
        priority: CRITICAL
        review_domain: Safety, environmental, legal, and compliance
      - key: mixed-metal-buyer-and-cost-scope
        description: Buyer specification and complete commercial terms are unavailable.
        affected_dimensions: [OUTPUT_BUYER, FINANCIAL]
        affected_route_keys: [KMI-ROU-MIX-METAL-V03]
        acquisition_action: Obtain written receiver specifications and comparable quotations with residue terms.
        acquisition_cost_class: QUOTATION
        delay_class: WEEKS
        priority: HIGH
        review_domain: Product, buyer, commercial, and financial
    effective_from: "2026-07-14"
    review_owner: Materials, safety, legal, buyer, and commercial reviewers

  - id: homogeneous-ferrous-direct-sale-v03
    business_id: KMI-ROU-FER-SALE-V03
    version: 3
    title: Direct sale of a characterised homogeneous ferrous stream
    description: >-
      Reference route for direct sale after grade, coatings, contamination, legal status, quantity,
      receiver specification, and commercial terms are evidenced. Visual homogeneity alone is not enough.
    maturity: COMMERCIAL
    evidence_class: ESTABLISHED
    method_class: DIRECT_SALE
    comparison_role: REFERENCE
    cost_model_coverage: UNKNOWN
    requires_partner: true
    jurisdiction_scope: European Union; Bulgarian and shipment applicability require qualified review.
    sources:
      - *eu_bat
    claims:
      - key: route-basis
        claim_type: READINESS
        statement: A homogeneous ferrous stream remains a preliminary sale candidate until technical and legal suitability is confirmed.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: Ferrous waste offered to a receiving facility.
        limitations: Does not define a scrap grade, product status, price, or buyer acceptance.
        conflicting_evidence: Coatings, attachments, grade variation, and contamination can change suitability.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(a) to BAT 2(c)
            feed_composition: Ferrous waste input
            feed_condition: As offered before acceptance
            physical_form: Homogeneous pieces or articles
            particle_size: Not specified
            contamination: Hazardous properties and process risks must be considered
            pretreatment: Characterisation and acceptance controls
            equipment_configuration: Not specified
            scale_and_throughput: Within applicable scope; not transferred
            measurement_method: Risk-based characterisation, acceptance, and output-quality management
            output_definition: Accepted ferrous lot or controlled rejection
            applicability: Supports characterisation and receiver-acceptance gates.
            limitations: No commercial grade or value is supplied.
            conflicting_evidence: None recorded for the limited BAT claim.
      - key: qualification-basis
        claim_type: COMMERCIAL
        statement: Direct sale requires written receiver criteria and complete settlement, logistics, deduction, rejection, and residue terms.
        evidence_state: SCREENED
        confidence: MEDIUM
        applicability: Commercial comparison for a characterised ferrous lot.
        limitations: Terms remain quotation-required and buyer-specific.
        conflicting_evidence: Buyers may classify the same feed differently.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(b) and BAT 2(c)
            feed_composition: Ferrous waste input and output
            feed_condition: Before acceptance and at dispatch
            physical_form: Segregated lot
            particle_size: Buyer-specific
            contamination: Buyer-specific
            pretreatment: Segregation and documented inspection
            equipment_configuration: Not specified
            scale_and_throughput: Lot-specific
            measurement_method: Acceptance and output-quality records
            output_definition: Receiver-accepted lot
            applicability: Supports written acceptance and documented output-quality requirements.
            limitations: No price or buyer specification is provided by the source.
            conflicting_evidence: None recorded for the limited management requirement.
    chains:
      - key: ferrous-sale-chain
        title: Characterise and sell directly
        description: High-level commercial route with no processing assumption.
        steps:
          - key: inspect
            sequence: 10
            operation_class: INSPECTION
            title: Inspect and characterise
            description: Establish grade indicators, coatings, contamination, quantity, and legal status.
            equipment_classes: [Inspection, weighing, and sampling systems]
            capability_classes: [Material identification, evidence custody]
          - key: qualify
            predecessor_key: inspect
            sequence: 20
            operation_class: QUALIFICATION
            title: Match written receiver specification
            description: Compare evidence with current receiver criteria and authorization.
            equipment_classes: [Document and quality-control systems]
            capability_classes: [Buyer, specification, and compliance review]
          - key: direct-sale
            predecessor_key: qualify
            sequence: 30
            operation_class: DIRECT_SALE
            title: Controlled direct sale candidate
            description: Compare only after complete quotation and rejection terms exist.
            equipment_classes: [Approved logistics and weighing systems]
            capability_classes: [Commercial comparison, traceability]
    requirements:
      - key: material-family-match
        dimension: MATERIAL_IDENTIFICATION
        predicate:
          fact_key: suspected_material
          operator: NORMALIZED_IN
          value: [ferrous metal, homogeneous ferrous, homogeneous ferrous stream, steel scrap, iron scrap]
        minimum_evidence_state: HEARSAY
        unknown_policy: PRELIMINARY
        failed_policy: NOT_RELEVANT
        blocking_scope: Route applicability only
        claim_key: route-basis
      - key: representative-characterisation
        dimension: TECHNICAL
        predicate: {fact_key: ferrous_characterisation, operator: EQUALS, value: COMPLETE}
        minimum_evidence_state: SCREENED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Technical and decision readiness
        claim_key: route-basis
      - key: qualified-safety-legal-review
        dimension: SAFETY_LEGAL
        predicate: {fact_key: ferrous_safety_legal, operator: EQUALS, value: CLEARED}
        minimum_evidence_state: VERIFIED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Sale and decision readiness
        claim_key: route-basis
      - key: written-buyer-acceptance
        dimension: OUTPUT_BUYER
        predicate: {fact_key: ferrous_buyer, operator: EQUALS, value: CONFIRMED}
        minimum_evidence_state: VERIFIED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Output and buyer readiness
        claim_key: qualification-basis
      - key: complete-commercial-scope
        dimension: FINANCIAL
        predicate: {fact_key: ferrous_commercial, operator: EQUALS, value: COMPLETE}
        minimum_evidence_state: VERIFIED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Financial and decision readiness
        claim_key: qualification-basis
    outcomes:
      - key: buyer-accepted-ferrous-lot
        name: Buyer-accepted ferrous lot
        role: OUTPUT
        yield_status: UNKNOWN
        physical_form: Segregated ferrous pieces or articles
        specification: Buyer-specific written grade and contamination limits.
        applications: [Authorized downstream ferrous recovery]
        buyer_constraints: [Written grade, deductions, rejection, weighing, and settlement terms]
        mass_balance_role: Measured accepted output
        claim_key: qualification-basis
      - key: ferrous-rejection
        name: Rejected or nonconforming material
        role: RESIDUE
        yield_status: UNKNOWN
        physical_form: Retained, returned, or segregated material
        specification: Lawful alternative destination required.
        applications: [Further characterisation or authorized alternative treatment]
        buyer_constraints: [No value assumed]
        mass_balance_role: Measured rejection and liability
        claim_key: qualification-basis
    performance_estimates: []
    cost_estimates: []
    failure_modes:
      - key: apparent-homogeneity-misclassifies-feed
        title: Apparent homogeneity hides grade, coating, or contamination variation
        causes: [Visual-only classification, attached non-ferrous parts, coatings, mixed grades]
        consequences: [Downgrade, rejection, deductions, safety or compliance failure]
        detection_evidence: [Representative inspection, screening, and buyer verification]
        mitigation_class: Evidence-backed classification and buyer qualification
        claim_key: route-basis
    guided_questions:
      - key: ferrous-characterisation-question
        prompt: Has representative grade, coating, attachment, and contamination evidence been recorded?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: SCREENED
        acquisition_cost_class: LABORATORY
        delay_class: DAYS
        requirement_keys: [representative-characterisation]
      - key: ferrous-safety-question
        prompt: Has a qualified waste-status, authorization, safety, and shipment review cleared direct sale?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: VERIFIED
        acquisition_cost_class: HIGH
        delay_class: WEEKS
        requirement_keys: [qualified-safety-legal-review]
      - key: ferrous-buyer-question
        prompt: Has the intended receiver confirmed the ferrous specification and acceptance terms in writing?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: VERIFIED
        acquisition_cost_class: QUOTATION
        delay_class: DAYS
        requirement_keys: [written-buyer-acceptance]
      - key: ferrous-commercial-question
        prompt: Are logistics, weighing, price, deductions, rejection, and settlement terms complete?
        answer_type: CATEGORY
        allow_unknown: true
        evidence_state_created: VERIFIED
        acquisition_cost_class: QUOTATION
        delay_class: DAYS
        requirement_keys: [complete-commercial-scope]
    knowledge_gaps:
      - key: ferrous-grade-and-contamination
        description: Representative grade, coatings, attachments, and contamination are unverified.
        affected_dimensions: [MATERIAL_IDENTIFICATION, TECHNICAL]
        affected_route_keys: [KMI-ROU-FER-SALE-V03]
        acquisition_action: Obtain representative identification and contamination evidence.
        acquisition_cost_class: LABORATORY
        delay_class: DAYS
        priority: HIGH
        review_domain: Materials and process engineering
      - key: ferrous-qualified-review
        description: Legal status, authorization, safety, and shipment route remain unresolved.
        affected_dimensions: [SAFETY_LEGAL]
        affected_route_keys: [KMI-ROU-FER-SALE-V03]
        acquisition_action: Obtain qualified legal, compliance, and safety review.
        acquisition_cost_class: HIGH
        delay_class: WEEKS
        priority: CRITICAL
        review_domain: Safety, environmental, legal, and compliance
      - key: ferrous-buyer-quotation
        description: Receiver specification and complete commercial quotation are unavailable.
        affected_dimensions: [OUTPUT_BUYER, FINANCIAL]
        affected_route_keys: [KMI-ROU-FER-SALE-V03]
        acquisition_action: Obtain written buyer acceptance and comparable all-in quotation.
        acquisition_cost_class: QUOTATION
        delay_class: DAYS
        priority: HIGH
        review_domain: Product, buyer, commercial, and financial
    effective_from: "2026-07-14"
    review_owner: Materials, legal, buyer, and commercial reviewers

  - id: metal-bearing-fines-hold-v03
    business_id: KMI-ROU-FINES-HOLD-V03
    version: 3
    title: Hold metal-bearing fines for characterisation and qualified routing
    description: >-
      Fail-closed discovery route for heterogeneous fines where composition, particle-size
      distribution, moisture, hazardous constituents, recoverable metal distribution, residues,
      and receiver acceptance are incomplete. It recommends evidence acquisition, not processing.
    maturity: COMMERCIAL
    evidence_class: ESTABLISHED
    method_class: HOLD
    comparison_role: REFERENCE
    cost_model_coverage: UNKNOWN
    requires_partner: true
    jurisdiction_scope: European Union; waste classification, sampling, storage, and destination require qualified review.
    sources:
      - *eu_bat
    claims:
      - key: route-basis
        claim_type: READINESS
        statement: >-
          Heterogeneous metal-bearing fines should remain on hold until risk-based characterisation
          establishes composition and technical and legal suitability for a receiving route.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: Fine, pasty, or heterogeneous waste input with incomplete composition.
        limitations: Does not prescribe sampling, laboratory, storage, or treatment procedures.
        conflicting_evidence: A qualified assessment may identify a direct receiver or exclude recovery.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(a) and BAT 2(b)
            feed_composition: Heterogeneous waste input
            feed_condition: Before acceptance or treatment
            physical_form: Fine or pasty material where applicable
            particle_size: Must be established for the stream
            contamination: Hazardous properties and environmental risks may be material
            pretreatment: None assumed
            equipment_configuration: None; this is a hold-for-evidence route
            scale_and_throughput: Not transferred
            measurement_method: Risk-based information collection, sampling, and characterisation
            output_definition: Qualified evidence package and receiving-route decision
            applicability: Supports holding and characterisation before route selection.
            limitations: No route performance, cost, or value is established.
            conflicting_evidence: None recorded for the limited requirement.
      - key: qualification-basis
        claim_type: OUTPUT
        statement: No concentrate, residue, or value conclusion is available until mass balance, receiver criteria, and liability routes are evidenced.
        evidence_state: SCREENED
        confidence: HIGH
        applicability: Metal-bearing fines under discovery assessment.
        limitations: External laboratory, processor, and receiver evidence is required.
        conflicting_evidence: Fine fractions can vary within one lot.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(c), output quality management system
            feed_composition: Waste-treatment outputs
            feed_condition: After any future treatment
            physical_form: Concentrate and residue fractions
            particle_size: Output-specific
            contamination: Output-specific
            pretreatment: Not assumed
            equipment_configuration: Not specified
            scale_and_throughput: Not transferred
            measurement_method: Output analysis and tracking
            output_definition: Receiver-qualified output or controlled residue
            applicability: Supports output and residue qualification gates.
            limitations: No output specification or yield is asserted.
            conflicting_evidence: None recorded.
    chains:
      - key: fines-evidence-chain
        title: Evidence acquisition before route choice
        description: Stopping route that preserves material while qualified evidence is acquired.
        steps:
          - key: hold
            sequence: 10
            operation_class: HOLD
            title: Hold and preserve traceability
            description: Do not infer composition, route, or value from appearance.
            equipment_classes: [Compatible controlled storage and evidence-custody systems]
            capability_classes: [Traceability, qualified storage review]
          - key: characterise
            predecessor_key: hold
            sequence: 20
            operation_class: INSPECTION
            title: Obtain representative qualified characterisation
            description: Establish route-changing composition, size, moisture, and hazard facts.
            equipment_classes: [Qualified sampling and analytical service classes]
            capability_classes: [Sampling design, laboratory and legal review]
          - key: qualify-receiver
            predecessor_key: characterise
            sequence: 30
            operation_class: QUALIFICATION
            title: Qualify processor or receiver
            description: Obtain written feed envelope, residue responsibility, and quotation.
            equipment_classes: [Document and commercial review systems]
            capability_classes: [Processor, buyer, and financial review]
    requirements:
      - key: material-family-match
        dimension: MATERIAL_IDENTIFICATION
        predicate:
          fact_key: suspected_material
          operator: NORMALIZED_IN
          value: [metal-bearing fines, metal bearing fines, contaminated fines, fines, concentrate, metal concentrate]
        minimum_evidence_state: HEARSAY
        unknown_policy: PRELIMINARY
        failed_policy: NOT_RELEVANT
        blocking_scope: Route applicability only
        claim_key: route-basis
      - key: representative-characterisation
        dimension: TECHNICAL
        predicate: {fact_key: fines_characterisation, operator: EQUALS, value: COMPLETE}
        minimum_evidence_state: SCREENED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Technical routing readiness
        claim_key: route-basis
      - key: qualified-safety-legal-review
        dimension: SAFETY_LEGAL
        predicate: {fact_key: fines_safety_legal, operator: EQUALS, value: CLEARED}
        minimum_evidence_state: VERIFIED
        unknown_policy: BLOCK
        failed_policy: BLOCK
        blocking_scope: Handling, routing, and decision readiness
        claim_key: route-basis
      - key: written-receiver-acceptance
        dimension: OUTPUT_BUYER
        predicate: {fact_key: fines_receiver, operator: EQUALS, value: CONFIRMED}
        minimum_evidence_state: VERIFIED
        unknown_policy: CONDITIONAL
        failed_policy: BLOCK
        blocking_scope: Receiver and output readiness
        claim_key: qualification-basis
