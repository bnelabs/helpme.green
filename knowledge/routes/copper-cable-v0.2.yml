        confidence: LOW
      - id: pita-cable-separation-2018
        source_type: PEER_REVIEWED
        publisher: Minerals journal
        title: Separation of Copper from Electric Cable Waste Based on Mineral Processing Methods - A Case Study
        url: "https://doi.org/10.3390/min8110517"
        published_on: "2018-11-08"
        accessed_on: "2026-07-13"
        geography: Portugal
        location_reference: "Laboratory scale: main jigging and shaking-table tests used 2.5 kg; separate flotation tests used 50 g"
        limitations: >-
          Laboratory gravity-separation study on a specific prepared feed. It is not evidence for a
