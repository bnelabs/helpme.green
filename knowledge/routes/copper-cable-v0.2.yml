schema_version: "0.2"
kind: routes
cards:
  - id: copper-cable-direct-sale
    business_id: KMI-ROU-CU-CABLE-SALE
    version: 1
    title: Direct sale of characterized insulated copper cable
    description: >-
      Reference route for sale of an evidence-backed cable lot to an authorized buyer under a
      written specification. Processing cost, material price, deductions, transport, testing, and
      rejection exposure are intentionally unknown until documented quotations are obtained.
    maturity: COMMERCIAL
    method_class: DIRECT_SALE
    comparison_role: REFERENCE
    cost_model_coverage: UNKNOWN
    requires_partner: true
    jurisdiction_scope: >-
      European Union and Bulgaria. Waste status, waste code, carrier and receiver authorization,
      destination, and shipment procedure require qualified case-specific review.
    sources:
      - &eu_wfd
        id: eu-wfd-2025
        source_type: REGULATION
        publisher: European Parliament and Council of the European Union
        title: Directive 2008/98/EC on waste, consolidated 16 October 2025
        url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02008L0098-20251016"
        published_on: "2025-10-16"
        accessed_on: "2026-07-13"
        geography: European Union
        jurisdiction: European Union, including Bulgaria through national implementation
        location_reference: "Regulatory scale: all waste holders and treatment scales in scope; Articles 3, 6, 13, 23 and 35"
        limitations: >-
          Consolidated text is a documentation aid; authentic Official Journal acts and current
          Bulgarian implementation require qualified legal review. It provides no batch composition.
        confidence: HIGH
      - &eu_copper_eow
        id: eu-copper-eow-715-2013
        source_type: REGULATION
        publisher: European Commission
        title: Regulation (EU) No 715/2013 establishing end-of-waste criteria for copper scrap
        url: "https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32013R0715"
        published_on: "2013-07-26"
        accessed_on: "2026-07-13"
        geography: European Union
        jurisdiction: Directly applicable European Union regulation
        location_reference: "Regulatory scale: each copper-scrap consignment; Articles 3 to 5 and Annex I"
        limitations: >-
          Applies only when every criterion, quality-management duty, and statement-of-conformity
          requirement is met. It does not make untreated insulated cable a product.
        confidence: HIGH
      - &eu_wsr
        id: eu-wsr-2024-1157
        source_type: REGULATION
        publisher: European Parliament and Council of the European Union
        title: Regulation (EU) 2024/1157 on shipments of waste
        url: "https://eur-lex.europa.eu/eli/reg/2024/1157/oj"
        published_on: "2024-04-30"
        accessed_on: "2026-07-13"
        geography: European Union and covered international movements
        jurisdiction: European Union waste shipments
        location_reference: "Regulatory scale: each in-scope shipment; Articles 2, 4, 18, 27, 85 and 86"
        limitations: >-
          The applicable control route depends on waste classification, destination, transition
          provisions, and facts of the movement; this card is not a shipment determination.
        confidence: HIGH
      - &bg_moew_wsr
        id: bg-moew-wsr-notice-2026
        source_type: OFFICIAL_TECHNICAL
        publisher: Ministry of Environment and Water of the Republic of Bulgaria
        title: New waste-transport rules and mandatory electronic system from 21 May 2026
        url: "https://www.moew.government.bg/en/new-rules-on-waste-transport-in-the-eu-and-a-mandatory-electronic-system-to-be-introduced-from-21-may/"
        published_on: "2026-04-08"
        accessed_on: "2026-07-13"
        geography: Bulgaria and European Union
        jurisdiction: Bulgarian implementation notice for European Union shipment procedures
        location_reference: "Administrative scale: in-scope cross-border waste procedures from 21 May 2026"
        limitations: >-
          General public notice only. It is not a classification, permit, or procedural decision
          for any particular batch or counterparty.
        confidence: HIGH
    input_envelope:
      material_codes: [COPPER_BEARING]
      eligible_cable_types:
        - Characterized insulated copper cable accepted in writing by the intended buyer
      excluded_conditions:
        - Unresolved hazardous or waste status
        - No representative copper-content evidence
        - No written buyer specification or current authorization evidence
        - Energized, wet, leaking, contaminated, or unsafe material
      requirements:
        - key: conductor_material
          operator: EQUALS
          value: COPPER
          minimum_evidence_level: E3
          allowed_truth_labels: [SCREENED, VERIFIED]
          unknown_action: INELIGIBLE
        - key: copper_content_wet_basis
          operator: EXISTS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: buyer_acceptance
          operator: EQUALS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: waste_and_hazard_status
          operator: EQUALS
          value: REVIEWED
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
    internal_capabilities:
      - Representative sampling and evidence custody
      - Lot weighing and commercial comparison
      - Authorization and specification review
    external_partner_profile:
      type: Authorized copper-cable buyer or recovery operator
      required_capabilities:
        - Current authorization covering the accepted waste code and activity
        - Written feed specification, sampling basis, deductions, and rejection terms
        - Traceable weighing, receipt, and settlement records
      limitations:
        - Partner capability and commercial terms are not yet verified
    unit_operations:
      - Documented receipt and characterization
      - Segregated storage and packaging
      - Authorized dispatch and receiver acceptance
      - Settlement reconciliation
    performance_estimates: []
    cost_estimates: []
    outputs:
      - key: accepted-insulated-cable
        name: Buyer-accepted characterized insulated cable lot
        status_assumption: WASTE
        yield_status: UNKNOWN
        physical_form: Segregated insulated cable lot
        expected_specification: Buyer-specific written cable specification; no default grade is asserted.
        applicability: >-
          No source-backed yield range is asserted. The accepted net mass must be measured for the
          actual consignment.
        by_products_and_residue_route: Rejected or nonconforming material remains controlled waste.
        use_cases: [Authorized downstream copper recovery]
        buyer_constraints:
          - Written acceptance, sampling, settlement, and rejection terms required
          - Product status is not assumed
        market_limitations:
          - No copper or polymer market price is stored in this processing card
          - Acceptance and deductions vary by lot and buyer
        source_ids: [eu-wfd-2025, eu-copper-eow-715-2013]
      - key: sale-rejected-residue
        name: Rejected or nonconforming cable fraction
        status_assumption: RESIDUE
        yield_status: UNKNOWN
        physical_form: Segregated returned or retained cable and foreign material
        expected_specification: No saleable specification is assumed.
        applicability: >-
          No source-backed yield range is asserted. Weigh and reconcile all rejected material
          against the dispatch and receiver records.
        use_cases: [Further characterization or authorized alternative recovery]
        buyer_constraints: [A documented lawful next route is required]
        market_limitations: [Disposal or return liability is contract-specific]
        source_ids: [eu-wfd-2025]
    safety_and_compliance_gates:
      - Electrical isolation and safe handling confirmed
      - Waste code and hazardous-property review complete
      - Site, carrier, broker where relevant, and receiver authorizations verified
      - Applicable domestic or cross-border shipment procedure approved by a qualified reviewer
      - Written buyer specification and residue responsibility recorded
    required_tests:
      - Representative copper-content measurement on the declared basis
      - Moisture and free-liquid assessment
      - Foreign-material and conductor verification
      - Buyer-required assay or acceptance test
    effective_from: "2026-07-13"
    review_owner: Commercial and qualified environmental reviewers

  - id: copper-cable-external-toll
    business_id: KMI-ROU-CU-TOLL
    version: 1
    title: External toll processing of characterized copper cable
    description: >-
      Conditional route for an authorized specialist to process a characterized lot under a written
      toll and settlement agreement. Transport, toll fee, yield, deductions, sampling, returned
      fractions, and residue responsibility remain unknown until partner-specific evidence exists.
    maturity: CONCEPT
    method_class: EXTERNAL_TOLL
    comparison_role: ALTERNATIVE
    cost_model_coverage: UNKNOWN
    requires_partner: true
    jurisdiction_scope: >-
      European Union and Bulgaria. Facility authorization, shipment controls, contract allocation,
      and output status are partner-, site-, and destination-specific.
    sources:
      - *eu_wfd
      - *eu_copper_eow
      - *eu_wsr
      - *bg_moew_wsr
    input_envelope:
      material_codes: [COPPER_BEARING]
      eligible_cable_types:
        - Characterized insulated copper cable within the specialist's written acceptance envelope
      excluded_conditions:
        - Unresolved hazardous or waste status
        - No current processor authorization or written acceptance envelope
        - No documented sampling, settlement, and residue protocol
        - Energized, leaking, or unsafe material
      requirements:
        - key: conductor_material
          operator: EQUALS
          value: COPPER
          minimum_evidence_level: E3
          allowed_truth_labels: [SCREENED, VERIFIED]
          unknown_action: INELIGIBLE
        - key: processor_acceptance
          operator: EQUALS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: processor_authorization
          operator: EQUALS
          value: VERIFIED
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: toll_mass_balance_protocol
          operator: EXISTS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
    internal_capabilities:
      - Representative sampling and dispatch weighing
      - Contract, authorization, and settlement review
      - Returned-fraction and certificate reconciliation
    external_partner_profile:
      type: Authorized copper-cable toll processor
      required_capabilities:
        - Written feed envelope and current authorization
        - Traceable inbound and outbound weighing
        - Agreed sampling, recovery, settlement, and rejection method
        - Documented destination and responsibility for every residue
      limitations:
        - No partner has been qualified and no quotation is represented
    unit_operations:
      - Partner qualification and feed acceptance
      - Controlled dispatch to the authorized facility
      - External specialist processing
      - Output, residue, certificate, and settlement reconciliation
    performance_estimates: []
    cost_estimates: []
    outputs:
      - key: toll-copper-fraction
        name: Partner-reported recovered copper fraction
        status_assumption: WASTE
        yield_status: UNKNOWN
        physical_form: Partner-defined recovered metal fraction
        expected_specification: Partner- and buyer-specific; independent acceptance evidence required.
        applicability: >-
          No source-backed yield range is asserted. Use certified partner mass and assay
          records for the actual lot.
        by_products_and_residue_route: All other fractions must be identified in the partner mass closure.
        use_cases: [Authorized downstream copper recovery]
        buyer_constraints: [Independent specification and lawful status review required]
        market_limitations: [No default yield, settlement, or metal value is asserted]
        source_ids: [eu-wfd-2025, eu-copper-eow-715-2013]
      - key: toll-insulation-fraction
        name: Partner-reported insulation-rich fraction
        status_assumption: WASTE
        yield_status: UNKNOWN
        physical_form: Partner-defined polymer-rich fraction
        expected_specification: Polymer identity, additives, contamination, and acceptance remain unverified.
        applicability: No source-backed yield range is asserted; use measured partner records for the actual lot.
        use_cases: [Authorized specialist assessment or recovery]
        buyer_constraints: [Written polymer acceptance criteria required]
        market_limitations: [Mixed insulation may have no recovery outlet]
        source_ids: [eu-wfd-2025]
      - key: toll-controlled-residue
        name: Toll-processing residue and unaccounted-loss control fraction
        status_assumption: RESIDUE
        yield_status: UNKNOWN
        physical_form: Fines, contamination, rejected fractions, or documented process loss
        expected_specification: Partner-specific waste classification and destination required.
        applicability: >-
          No source-backed yield range is asserted. Reconcile it with all returned and recovered
          retained fractions before approving settlement.
        use_cases: [Authorized further recovery where technically and lawfully accepted]
        buyer_constraints: [Partner must identify responsibility and final destination]
        market_limitations: [Treatment or disposal cost is quotation-specific]
        source_ids: [eu-wfd-2025]
    safety_and_compliance_gates:
      - Electrical isolation and safe handling confirmed
      - Waste classification and hazardous-property review complete
      - Processor, carrier, broker where relevant, and destination authorizations verified
      - Applicable shipment procedure approved by a qualified reviewer
      - Written toll, sampling, settlement, rejection, and residue-responsibility agreement executed
    required_tests:
      - Representative pre-dispatch composition and mass evidence
      - Partner-agreed input and output assays
      - Inbound and outbound scale-ticket reconciliation
      - Closed partner mass-balance statement for the actual lot
    effective_from: "2026-07-13"
    review_owner: Commercial, technical, and qualified environmental reviewers

  - id: copper-cable-manual-stripping
    business_id: KMI-ROU-CU-STRIP
    version: 1
    title: Internal controlled stripping of eligible copper cable
    description: >-
      Evidence-limited internal route for cable geometries shown by a representative trial to be
      safely separable with qualified staff and controlled equipment. No default productivity,
      labour, recovery, or cost is asserted; these must be measured during an approved pilot.
    maturity: CONCEPT
    method_class: MANUAL_STRIPPING
    comparison_role: ALTERNATIVE
    cost_model_coverage: UNKNOWN
    requires_partner: false
    jurisdiction_scope: >-
      Bulgaria. Site authorization, worker safety, waste treatment permission, output status, and
      downstream acceptance require qualified review before any pilot or operation.
    sources:
      - *eu_copper_eow
      - id: jrc-copper-eow-2011
        source_type: OFFICIAL_TECHNICAL
        publisher: European Commission Joint Research Centre
        title: End-of-waste Criteria for Copper and Copper Alloy Scrap - Technical Proposals
        url: "https://publications.jrc.ec.europa.eu/repository/handle/JRC64207"
        published_on: "2011-06-09"
        accessed_on: "2026-07-13"
        geography: European Union
        jurisdiction: European Union technical study; not binding law
        location_reference: "Sector scale: European copper-scrap recycling chain; JRC64207"
        limitations: >-
          Predates Regulation (EU) No 715/2013 and is used only for background on copper-scrap
          quality control. It supplies no Konverta-specific performance or cost.
        confidence: MEDIUM
      - id: lee-cable-separation-2016
        source_type: PEER_REVIEWED
        publisher: The Korean Institute of Resources Recycling
        title: Highly Efficient Mechanical Separation Process for Recycling Waste Jelly-Filled Communication Cables
        url: "https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002119652"
        quoted_on: "2026-07-13"
        accessed_on: "2026-07-13"
        geography: Republic of Korea
        location_reference: "Demonstration scale: reported continuous process at 55 kg/h for one jelly-filled communication-cable design"
        limitations: >-
          Cable- and equipment-specific study outside the European Union. It does not validate
          manual productivity, other cable geometries, local safety, economics, or commercial scale.
        confidence: MEDIUM
      - &eu_wt_bat
        id: eu-wt-bat-2018
        source_type: REGULATION
        publisher: European Commission
        title: Implementing Decision (EU) 2018/1147 establishing BAT conclusions for waste treatment
        url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02018D1147-20180817"
        published_on: "2018-08-17"
        accessed_on: "2026-07-13"
        geography: European Union
        jurisdiction: In-scope installations under the Industrial Emissions Directive
        location_reference: "Industrial scale: scope thresholds and general waste-treatment controls in the Annex"
        limitations: >-
          Applicability depends on installation scope and permitting. The controls inform a
          conservative review but do not establish a small site's authorization or route economics.
        confidence: HIGH
    input_envelope:
      material_codes: [COPPER_BEARING]
      eligible_cable_types:
        - Cable geometry accepted by a documented representative stripping trial
        - Segregated dry cable with verified copper conductor and removable insulation
      excluded_conditions:
        - Fine, fragile, multi-material, armoured, contaminated, or unresolved cable
        - Uncontrolled sharps, energized cable, free liquids, or unsafe handling condition
        - No approved equipment, task risk assessment, or residue route
      requirements:
        - key: conductor_material
          operator: EQUALS
          value: COPPER
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: stripping_trial_eligible
          operator: EQUALS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: approved_task_risk_assessment
          operator: EQUALS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: verified_input_mass
          operator: EXISTS
          value: true
          minimum_evidence_level: E2
          allowed_truth_labels: [SCREENED, VERIFIED]
          unknown_action: INELIGIBLE
    internal_capabilities:
      - Qualified operators and supervised pilot control
      - Guarded, purpose-designed cable-stripping equipment approved for the cable type
      - Segregated fraction capture, weighing, and evidence recording
      - Ergonomic, exposure, housekeeping, and maintenance controls
    external_partner_profile:
      type: No external processor assumed; authorized downstream receivers remain required
      required_capabilities:
        - Written acceptance criteria for copper and insulation fractions
      limitations:
        - Downstream receiver capability is not yet verified
    unit_operations:
      - Cable-specific suitability screening
      - Supervised controlled stripping
      - Separate capture, inspection, and weighing of all fractions
      - Output quarantine pending reviewer and receiver acceptance
    performance_estimates: []
    cost_estimates: []
    outputs:
      - key: stripped-copper-conductor
        name: Separated copper conductor
        status_assumption: PROSPECTIVE_OUTPUT
        yield_status: UNKNOWN
        physical_form: Separated cable conductor
        expected_specification: >-
          Receiver specification plus all applicable Regulation (EU) No 715/2013 criteria before any
          end-of-waste assertion, including foreign material strictly below 2% by weight.
        applicability: >-
          Actual yield and quality remain unknown. The strict foreign-material threshold applies only
          when every criterion and producer duty in the regulation is satisfied.
        by_products_and_residue_route: Insulation and all nonconforming material remain separately controlled.
        use_cases: [Direct input to an accepting metal producer only after lawful status and specification confirmation]
        buyer_constraints: [Qualified grading, receiver acceptance, and status evidence required]
        market_limitations: [No copper price, recovery, or sale deduction is asserted]
        source_ids: [eu-copper-eow-715-2013]
      - key: stripped-insulation
        name: Separated insulation-rich fraction
        status_assumption: WASTE
        yield_status: UNKNOWN
        physical_form: Cable insulation pieces with possible attachments
        expected_specification: Polymer identity, additives, contamination, and receiver criteria remain unknown.
        applicability: No source-backed yield range is asserted; weigh the actual pilot output.
        use_cases: [Authorized specialist identification or recovery]
        buyer_constraints: [Written acceptance and regulated-substance criteria required]
        market_limitations: [Mixed or contaminated insulation may have no recovery outlet]
        source_ids: [eu-copper-eow-715-2013]
      - key: stripping-controlled-residue
        name: Stripping residue and unaccounted-loss control fraction
        status_assumption: RESIDUE
        yield_status: UNKNOWN
        physical_form: Foreign items, connectors, fines, and nonconforming cable
        expected_specification: Separate waste classification and documented destination required.
        applicability: No source-backed yield range is asserted; close mass with measured outputs for each pilot lot.
        use_cases: [Further authorized sorting or recovery where accepted]
        buyer_constraints: [No disposal or recovery route is assumed]
        market_limitations: [Handling and destination cost must be quoted]
        source_ids: [eu-wt-bat-2018]
    safety_and_compliance_gates:
      - Written site and waste-treatment authorization review complete
      - Electrical isolation, guarding, ergonomic, exposure, and housekeeping controls approved
      - Cable-specific representative pilot approved by technical and safety reviewers
      - All output and residue destinations accepted in writing
      - Outputs remain quarantined until lawful status and specification are confirmed
    required_tests:
      - Representative cable-geometry and composition verification
      - Supervised pilot time and mass measurement
      - Copper and insulation fraction inspection and buyer-required testing
      - Closed mass balance including connectors, fines, and retained samples
    effective_from: "2026-07-13"
    review_owner: Technical, operations, EHS, and qualified environmental reviewers

  - id: copper-cable-internal-granulation
    business_id: KMI-ROU-CU-GRAN
    version: 1
    title: Internal granulation and mechanical separation of eligible copper cable
    description: >-
      Conditional internal route using purpose-designed size-reduction, physical separation, dust
      capture, and fraction-control equipment. Public evidence establishes equipment classes and
      selected declared capacities, but not Konverta yield, energy per tonne, labour, maintenance,
      wear, capital cost, operating cost, or buyer acceptance; those remain pilot and quotation gaps.
    maturity: CONCEPT
    method_class: GRANULATION
    comparison_role: ALTERNATIVE
    cost_model_coverage: UNKNOWN
    requires_partner: false
    jurisdiction_scope: >-
      Bulgaria and European Union. Site authorization, industrial-emissions applicability, worker
      safety, waste treatment permission, output status, and receiver acceptance require qualified review.
    sources:
      - *eu_copper_eow
      - *eu_wt_bat
      - id: stokkermill-ks-2026
        source_type: EQUIPMENT_SUPPLIER_STATEMENT
        publisher: Stokkermill Recycling Machinery
        title: K-S series wire granulators - official product page
        url: "https://www.stokkermill.com/recycling-machines/cables-wires-granulator"
        quoted_on: "2026-07-13"
        accessed_on: "2026-07-13"
        geography: Manufacturer based in Italy; marketed internationally
        location_reference: "Equipment scale: K-85S and K-130S declared at 80 to 130 kg/h input and 8.5 to 13 kW installed power"
        limitations: >-
          Manufacturer statement, not independent test data. Feed mix, utilization, actual draw,
          recovery, purity, labour, wear, maintenance, and annual scale are not established.
        confidence: LOW
      - id: eldan-powerkat-b-2026
        source_type: EQUIPMENT_SUPPLIER_STATEMENT
        publisher: Eldan Recycling A/S
        title: REDOMA Powerkat B cable plant official product sheet
        url: "https://eldan-recycling.com/wp-content/uploads/2021/06/Powerkat-B-Cable-Plant.pdf"
        quoted_on: "2026-07-13"
        accessed_on: "2026-07-13"
        geography: Manufacturer based in Denmark; marketed internationally
        location_reference: "Equipment scale: declared 825 to 950 kg/h input for cable at 50 to 60 percent copper content"
        limitations: >-
          Manufacturer statement for a specific plant configuration. It does not establish Konverta
