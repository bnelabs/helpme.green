    input_envelope:
      material_codes: [COPPER_BEARING]
      eligible_cable_types:
        - Dry characterized cable inside the selected equipment supplier's written feed envelope
        - Cable lot proven suitable by a representative controlled acceptance trial
      excluded_conditions:
        - Energized, wet, leaking, contaminated, explosive, or unresolved hazardous material
        - Steel-armoured, aluminium-bearing, ultra-fine, or mixed cable outside the qualified envelope
        - Batteries, sealed components, free liquids, or dangerous items
        - No dust-control, guarding, maintenance, residue, or receiver plan
      requirements:
        - key: conductor_material
          operator: EQUALS
          value: COPPER
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: supplier_feed_envelope_match
          operator: EQUALS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: representative_acceptance_trial
          operator: EQUALS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
        - key: approved_site_and_ehs_controls
          operator: EQUALS
          value: true
          minimum_evidence_level: E3
          allowed_truth_labels: [VERIFIED]
          unknown_action: INELIGIBLE
    internal_capabilities:
      - Authorized site and purpose-designed guarded equipment
      - Feed inspection and dangerous-item exclusion
      - Dust and particulate capture with approved housekeeping controls
      - Trained operators, isolation controls, and supervised maintenance
      - Fraction sampling, weighing, mass closure, and retained-sample custody
      - Energy, labour, consumable, wear, maintenance, and downtime measurement
    external_partner_profile:
      type: No toll processor assumed; equipment supplier and authorized output receivers are required
      required_capabilities:
        - Written equipment feed envelope, warranty, commissioning, and service terms
        - Written copper, insulation, and residue acceptance criteria from receivers
      limitations:
        - Supplier declarations and receiver capability are not yet independently verified
    unit_operations:
      - Documented receipt, inspection, and segregation
      - Guarded mechanical size reduction
      - Physical metal and insulation separation
      - Dust capture and controlled collection of fines
      - Fraction inspection, weighing, mass closure, and output quarantine
    performance_estimates: []
    cost_estimates: []
    outputs:
      - key: granulated-copper-fraction
        name: Separated copper-rich granules
        status_assumption: PROSPECTIVE_OUTPUT
        yield_status: UNKNOWN
        physical_form: Copper-rich granules from physical separation
        expected_specification: >-
          Receiver specification plus every applicable Regulation (EU) No 715/2013 criterion before
          any end-of-waste assertion, including foreign material strictly below 2% by weight.
        applicability: >-
          Actual yield and quality remain unknown. The strict foreign-material threshold applies only
          when every criterion and producer duty in the regulation is satisfied.
        by_products_and_residue_route: Insulation, fines, and nonconforming material remain separately controlled.
        use_cases: [Direct input to an accepting metal producer only after lawful status and specification confirmation]
