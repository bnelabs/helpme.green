schema_version: "0.3"
kind: materials
cards:
  - id: copper-cable-composition-v03
    version: 3
    code: CU_CABLE_COMPOSITION_V03
    title: Copper cable and harness composition
    description: >-
      Discovery profile for copper-bearing cable, insulated wire, armoured cable, and harness
      structures. Actual conductor, insulation, screen, armour, filler, and attachment proportions
      remain unknown until evidenced for the specific stream.
    sources:
      - &eu_weee
        id: eu-weee-directive-2012
        source_type: REGULATION
        publisher: European Parliament and Council of the European Union
        title: Directive 2012/19/EU on waste electrical and electronic equipment
        url: https://eur-lex.europa.eu/eli/dir/2012/19/oj/eng
        published_on: "2012-07-24"
        accessed_on: "2026-07-14"
        geography: European Union
        jurisdiction: European Union
        location_reference: Annex VII, selective treatment requirements
        limitations: >-
          Applies to WEEE within scope. It does not classify a particular cable stream, establish
          buyer specifications, or authorise treatment.
        confidence: HIGH
      - &eu_bat
        id: eu-waste-treatment-bat-2018
        source_type: REGULATION
        publisher: European Commission
        title: Commission Implementing Decision (EU) 2018/1147 on BAT conclusions for waste treatment
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02018D1147-20180817
        published_on: "2018-08-17"
        accessed_on: "2026-07-14"
        geography: European Union
        jurisdiction: European Union
        location_reference: Annex, BAT 2 and sections 2.1 to 2.3
        limitations: >-
          Applies only to activities and installations within its legal and technical scope.
          Site-specific permit conditions and applicability require qualified review.
        confidence: HIGH
    components:
      - key: copper-conductor
        name: Copper-bearing conductor
        role: PRIMARY
        relationship_type: MATRIX
        evidence_state: SCREENED
        physical_form: Solid or stranded conductive core
      - key: polymer-insulation
        name: Polymer insulation or sheath
        parent_key: copper-conductor
        role: LAYER
        relationship_type: COATED
        evidence_state: SCREENED
        physical_form: Continuous insulation or outer sheath
      - key: metallic-screen-armour
        name: Optional metallic screen or armour
        parent_key: polymer-insulation
        role: LAYER
        relationship_type: LAYERED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Wire, braid, tape, or armour layer when present
      - key: fillers-attachments
        name: Fillers, connectors, tapes, and attachments
        parent_key: polymer-insulation
        role: ATTACHMENT
        relationship_type: ATTACHED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Heterogeneous attached or embedded items
    property_definitions: []
    claims:
      - key: cable-structure-varies
        claim_type: COMPOSITION
        statement: >-
          Cable and harness feed can contain a bonded or layered combination of conductor,
          insulation, sheath, screens, armour, fillers, connectors, and attachments; the specific
          structure controls liberation and output contamination risk.
        evidence_state: SCREENED
        confidence: MEDIUM
        applicability: Discovery taxonomy for copper-bearing cable and harness streams.
        limitations: Actual components and proportions require stream-specific inspection and testing.
        conflicting_evidence: No conflict recorded at discovery level; individual products vary.
        sources:
          - source_id: eu-weee-directive-2012
            source_location: Annex VII, external electric cables and selective-treatment list
            feed_composition: WEEE cables and cable-containing assemblies
            feed_condition: Collected WEEE or removed cable
            physical_form: Cable or harness
            particle_size: Intact or removed items; no reduced-size transfer is asserted
            contamination: Hazardous constituents and attachments may be present
            pretreatment: Selective treatment where legally applicable
            equipment_configuration: Not specified by this claim
            scale_and_throughput: Not specified
            measurement_method: Documentary classification and inspection
            output_definition: Separated cable or cable-derived fractions
            applicability: Supports a discovery-level cable structure and selective-treatment gate.
            limitations: Does not establish composition, recovery, yield, or buyer acceptance.
            conflicting_evidence: None recorded for this limited claim.
    component_properties: []
    guided_questions: []
    knowledge_gaps: []
    effective_from: "2026-07-14"
    review_owner: Materials and process engineering

  - id: ferrous-homogeneous-v03
    version: 3
    code: FERROUS_HOMOGENEOUS_V03
    title: Homogeneous ferrous stream
    description: >-
      Discovery profile for a visually homogeneous ferrous stream. Grade, coatings, attachments,
      hazardous contamination, and buyer classification remain separate evidence questions.
    sources:
      - *eu_bat
    components:
      - key: ferrous-body
        name: Ferrous metal body
        role: PRIMARY
        relationship_type: LOOSE
        evidence_state: OBSERVED
        physical_form: Homogeneous pieces, offcuts, or articles
      - key: coatings-attachments
        name: Possible coatings and attachments
        parent_key: ferrous-body
        role: COATING
        relationship_type: COATED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Surface coating or attached non-ferrous item when present
    property_definitions: []
    claims:
      - key: homogeneous-does-not-prove-grade
        claim_type: READINESS
        statement: >-
          Visual homogeneity does not establish alloy grade, coating status, contamination, or
          technical and legal suitability for a particular receiving route.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: Waste pre-acceptance and characterisation for a ferrous stream.
        limitations: The BAT source does not define commercial scrap grades or buyer acceptance.
        conflicting_evidence: None recorded for this limited pre-acceptance claim.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(a) and BAT 2(b)
            feed_composition: Waste input requiring characterisation
            feed_condition: As offered before acceptance
            physical_form: Any form within applicable waste-treatment scope
            particle_size: Not specified
            contamination: Hazardous properties and process risks are expressly relevant
            pretreatment: Pre-acceptance before treatment
            equipment_configuration: Not specified
            scale_and_throughput: Within the Decision's applicable installation scope
            measurement_method: Risk-based information collection, sampling, and characterisation
            output_definition: Accepted or rejected input for a technically and legally suitable route
            applicability: Supports a fail-closed characterisation requirement.
            limitations: Does not establish a particular material grade or commercial price.
            conflicting_evidence: None recorded.
    component_properties: []
    guided_questions: []
    knowledge_gaps: []
    effective_from: "2026-07-14"
    review_owner: Materials and process engineering

  - id: mixed-metals-v03
    version: 3
    code: MIXED_METALS_V03
    title: Mixed ferrous and non-ferrous metals
    description: >-
      Discovery profile for loose mixed-metal streams. Metal families, attachments, coatings,
      dangerous items, liberation state, and recoverable fractions remain uncertain until evidenced.
    sources:
      - *eu_bat
    components:
      - key: ferrous-fraction
        name: Ferrous fraction
        role: PRIMARY
        relationship_type: LOOSE
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Loose pieces or shredded fraction
      - key: nonferrous-fraction
        name: Non-ferrous fraction
        role: PRIMARY
        relationship_type: LOOSE
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Loose pieces or shredded fraction
      - key: dangerous-items
        name: Possible dangerous or non-depolluted items
        role: CONTAMINANT
        relationship_type: LOOSE
        evidence_state: HEARSAY
        physical_form: Cylinders, non-depolluted equipment, or hazardous items when present
    property_definitions: []
    claims:
      - key: mixed-metals-need-inspection
        claim_type: SAFETY
        statement: >-
          Metal waste intended for shredding requires detailed input inspection and removal of
          dangerous items before mechanical treatment.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: Mechanical treatment in shredders of metal waste within BAT scope.
        limitations: Does not prescribe an inspection procedure or approve shredding.
        conflicting_evidence: None recorded for this legal BAT conclusion.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, section 2.2.1, BAT 26(a) to BAT 26(c)
            feed_composition: Baled or loose metal waste input
            feed_condition: Before shredding
            physical_form: Metal waste, including baled input
            particle_size: Pre-shred input
            contamination: Dangerous, non-depolluted, PCB, mercury, or radioactive items may matter
            pretreatment: Detailed inspection and removal of dangerous items
            equipment_configuration: Mechanical treatment in metal-waste shredders
            scale_and_throughput: Applicable installations within Decision scope
            measurement_method: Documented inspection and acceptance control
            output_definition: Feed accepted for mechanical treatment after applicable controls
            applicability: Supports inspection and dangerous-item gates.
            limitations: Does not establish separation performance or product specifications.
            conflicting_evidence: None recorded.
    component_properties: []
    guided_questions: []
    knowledge_gaps: []
    effective_from: "2026-07-14"
    review_owner: Materials and process engineering

  - id: metal-bearing-fines-v03
    version: 3
    code: METAL_BEARING_FINES_V03
    title: Contaminated metal-bearing fines
    description: >-
      Discovery profile for heterogeneous fines or concentrates with uncertain metal distribution,
      moisture, organics, salts, hazardous constituents, particle-size distribution, and liabilities.
    sources:
      - *eu_bat
    components:
      - key: metal-bearing-fines
        name: Metal-bearing fine fraction
        role: PRIMARY
        relationship_type: LOOSE
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Heterogeneous fine particles or concentrate
      - key: moisture
        name: Moisture
        parent_key: metal-bearing-fines
        role: CONTAMINANT
        relationship_type: EMBEDDED
        evidence_state: OBSERVED
        physical_form: Free or bound moisture associated with fines
      - key: foreign-fines
        name: Mineral, polymer, salt, or organic fine fraction
        role: CONTAMINANT
        relationship_type: LOOSE
        evidence_state: HEARSAY
        physical_form: Uncharacterised fine particles
    property_definitions: []
    claims:
      - key: fines-require-characterisation
        claim_type: READINESS
        statement: >-
          A metal-bearing-fines route requires risk-based pre-acceptance information and sufficient
          knowledge of composition; visual appearance alone is not enough.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: Discovery and pre-acceptance of heterogeneous fines.
        limitations: Does not specify a laboratory method, sampling plan, or treatment recipe.
        conflicting_evidence: None recorded for this limited requirement.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(a), waste characterisation and pre-acceptance
            feed_composition: Heterogeneous waste input
            feed_condition: As offered before acceptance
            physical_form: Fine or pasty material where applicable
            particle_size: Must be established for the specific stream
            contamination: Hazardous properties and environmental risks require assessment
            pretreatment: None assumed
            equipment_configuration: Not specified
            scale_and_throughput: Within the Decision's applicable scope
            measurement_method: Risk-based information collection and characterisation
            output_definition: Evidence package for route screening
            applicability: Supports a hold-for-evidence route when composition is incomplete.
            limitations: No numeric metal recovery, cost, or value may be inferred.
            conflicting_evidence: None recorded.
    component_properties: []
    guided_questions: []
    knowledge_gaps: []
    effective_from: "2026-07-14"
    review_owner: Materials and process engineering

  - id: mixed-weee-polymers-v03
    version: 3
    code: MIXED_WEEE_POLYMERS_V03
    title: Mixed WEEE polymer fraction
    description: >-
      Discovery profile for mixed plastics from WEEE with uncertain polymer families, additives,
      flame retardants, coatings, fillers, degradation history, and cross-contamination.
    sources:
      - &jrc_weee_plastics
        id: jrc-weee-plastics-2016
        source_type: OFFICIAL_TECHNICAL
        publisher: Joint Research Centre, European Commission
        title: Revision of methods to assess material efficiency of energy related products and potential requirements
        url: https://publications.jrc.ec.europa.eu/repository/handle/JRC104065
        published_on: "2016-12-02"
        accessed_on: "2026-07-14"
        geography: European Union
        jurisdiction: European Union product-policy context
        location_reference: Chapter 5 and repository abstract on recyclability of plastics
        limitations: >-
          Product-policy research and discovery evidence, not a buyer specification or proof of
          performance for a particular WEEE plastic fraction.
        confidence: HIGH
      - &eu_pops
        id: eu-pops-regulation-2025
        source_type: REGULATION
        publisher: European Parliament and Council of the European Union
        title: Regulation (EU) 2019/1021 on persistent organic pollutants, consolidated 4 August 2025
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02019R1021-20250804
        published_on: "2025-08-04"
        accessed_on: "2026-07-14"
        geography: European Union
        jurisdiction: European Union
        location_reference: Article 7 and Annex IV
        limitations: >-
          Legal applicability, current concentration limits, sampling, and classification require
          qualified review for the particular waste and date.
        confidence: HIGH
      - *eu_weee
    components:
      - key: thermoplastic-fractions
        name: Mixed thermoplastic families
        role: PRIMARY
        relationship_type: LOOSE
        evidence_state: SCREENED
        physical_form: Mixed rigid or flexible fragments
      - key: fillers-reinforcements
        name: Fillers and reinforcements
        parent_key: thermoplastic-fractions
        role: FILLER
        relationship_type: REINFORCED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Embedded filler or reinforcement
      - key: flame-retardant-additives
        name: Possible flame-retardant additives
        parent_key: thermoplastic-fractions
        role: ADDITIVE
        relationship_type: EMBEDDED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Additive within polymer matrix
      - key: coatings-metal-inserts
        name: Coatings and metal inserts
        parent_key: thermoplastic-fractions
        role: ATTACHMENT
        relationship_type: ATTACHED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Coated surfaces or attached inserts
    property_definitions: []
    claims:
      - key: weee-polymer-heterogeneity
        claim_type: INTERACTION
        statement: >-
          Multiple polymers, sorting barriers, additives including flame retardants, difficult
          extraction, downcycling, and low secondary-material value are documented challenges for
          WEEE plastics.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: Discovery-level WEEE polymer route screening.
        limitations: Does not prove that a particular fraction is unrecyclable or contain a regulated substance.
        conflicting_evidence: Technology capability varies; specialist and buyer evidence is still required.
        sources:
          - source_id: jrc-weee-plastics-2016
            source_location: Chapter 5; repository abstract, paragraphs on recyclability of plastics
            feed_composition: Plastics from energy-related products and WEEE
            feed_condition: End-of-life product plastics
            physical_form: Parts or separated plastic fractions
            particle_size: Not fixed
            contamination: Multiple polymers and additives, especially flame retardants
            pretreatment: Dismantling, identification, and sorting may be relevant
            equipment_configuration: Not transferred to a specific sorting line
            scale_and_throughput: Not transferred
            measurement_method: JRC technical review and product-policy assessment
            output_definition: Potentially recyclable polymer fraction requiring qualification
            applicability: Supports heterogeneity and additive interaction gates.
            limitations: No route-specific yield or cost can be transferred.
            conflicting_evidence: Technology and product mix vary.
    component_properties: []
    guided_questions: []
    knowledge_gaps: []
    effective_from: "2026-07-14"
    review_owner: Materials and process engineering

  - id: metal-plastic-composite-v03
    version: 3
    code: METAL_PLASTIC_COMPOSITE_V03
    title: Bonded and layered metal-plastic composite
    description: >-
      Discovery profile for layered, bonded, coated, or embedded metal-plastic structures where
      interface strength and liberation size can control separation and output contamination.
    sources:
      - *eu_bat
      - *jrc_weee_plastics
    components:
      - key: metal-substrate
        name: Metal substrate or layer
        role: LAYER
        relationship_type: LAYERED
        evidence_state: OBSERVED
        physical_form: Sheet, foil, wire, insert, or rigid substrate
      - key: polymer-layer
        name: Polymer layer or matrix
        parent_key: metal-substrate
        role: LAYER
        relationship_type: BONDED
        evidence_state: OBSERVED
        physical_form: Bonded layer or encapsulating matrix
      - key: surface-coating
        name: Surface coating
        parent_key: polymer-layer
        role: COATING
        relationship_type: COATED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Thin coating when present
      - key: attachments
        name: Mechanical attachments
        parent_key: metal-substrate
        role: ATTACHMENT
        relationship_type: ATTACHED
        evidence_state: EDUCATED_ESTIMATE
        physical_form: Fastener, connector, or embedded insert
    property_definitions: []
    claims:
      - key: composite-needs-structure-evidence
        claim_type: READINESS
        statement: >-
          A composite route must establish the layered or bonded structure and contaminant context
          before assuming that mechanical treatment will yield buyer-qualified fractions.
        evidence_state: SCREENED
        confidence: MEDIUM
        applicability: Discovery-level bonded or layered metal-plastic structures.
        limitations: Does not predict liberation size, yield, purity, or equipment performance.
        conflicting_evidence: Composite construction and bond strength vary materially.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, BAT 2(a) and BAT 2(b)
            feed_composition: Composite waste input
            feed_condition: Before acceptance or treatment
            physical_form: Bonded or layered structures
            particle_size: Not established
            contamination: Coatings, additives, and attachments may affect suitability
            pretreatment: Characterisation before route selection
            equipment_configuration: Not specified
            scale_and_throughput: Not transferred
            measurement_method: Risk-based characterisation and acceptance
            output_definition: Qualified or rejected route candidate
            applicability: Supports structure and compatibility evidence requirements.
            limitations: No mechanical recipe or performance transfer is provided.
            conflicting_evidence: None recorded for the limited characterisation requirement.
    component_properties: []
    guided_questions: []
    knowledge_gaps: []
    effective_from: "2026-07-14"
    review_owner: Materials and process engineering

  - id: cooling-weee-assembly-v03
    version: 3
    code: COOLING_WEEE_ASSEMBLY_V03
    title: Refrigerator and cooling-appliance WEEE assembly
    description: >-
      Discovery profile for cooling appliances containing attached metal, polymer, cable, foam,
      compressor, oil, and possible volatile fluorocarbon or hydrocarbon-bearing systems.
    sources:
      - *eu_weee
      - *eu_bat
    components:
      - key: appliance-assembly
        name: Cooling-appliance assembly
        role: PRIMARY
        relationship_type: ATTACHED
        evidence_state: OBSERVED
        physical_form: Intact or partly dismantled appliance
      - key: metal-cabinet-frame
        name: Metal cabinet and frame
        parent_key: appliance-assembly
        role: ATTACHMENT
        relationship_type: ATTACHED
        evidence_state: OBSERVED
        physical_form: Sheet-metal cabinet and structural parts
      - key: polymer-liner-parts
        name: Polymer liner and parts
        parent_key: appliance-assembly
        role: LAYER
        relationship_type: ATTACHED
        evidence_state: OBSERVED
        physical_form: Liner, drawers, and plastic attachments
      - key: insulation-foam
        name: Insulation foam
        parent_key: polymer-liner-parts
        role: MATRIX
        relationship_type: FOAMED
        evidence_state: OBSERVED
        physical_form: Foamed insulation bonded within cabinet structure
      - key: cooling-circuit-compressor
        name: Cooling circuit, compressor, refrigerant, and oil
        parent_key: appliance-assembly
        role: ATTACHMENT
        relationship_type: ATTACHED
        evidence_state: OBSERVED
        physical_form: Sealed circuit and compressor assembly
      - key: cable-harness
        name: Cable harness
        parent_key: appliance-assembly
        role: ATTACHMENT
        relationship_type: ATTACHED
        evidence_state: OBSERVED
        physical_form: Attached insulated wiring
    property_definitions: []
    claims:
      - key: cooling-weee-special-treatment
        claim_type: SAFETY
        statement: >-
          Cooling-appliance WEEE containing volatile fluorocarbons or volatile hydrocarbons requires
          specialist treatment controls for refrigerants, oils, emissions, and explosion risk.
        evidence_state: VERIFIED
        confidence: HIGH
        applicability: WEEE containing VFCs or VHCs within BAT scope.
        limitations: Does not identify the refrigerant or authorise any handling or treatment operation.
        conflicting_evidence: Refrigerant and foam-blowing-agent systems vary by appliance and age.
        sources:
          - source_id: eu-waste-treatment-bat-2018
            source_location: Annex, sections 2.3.1 and 2.3.2, BAT 29 and BAT 30
            feed_composition: WEEE containing VFCs and/or VHCs
            feed_condition: Intact or prepared cooling equipment
            physical_form: Cooling-appliance assembly
            particle_size: Pre-treatment assembly; no reduced-size transfer asserted
            contamination: Refrigerants, oils, and combustible gases may be present
            pretreatment: Specialist removal and capture controls
            equipment_configuration: Enclosed specialist WEEE treatment systems
            scale_and_throughput: Within applicable installation scope
            measurement_method: BAT-defined monitoring and control context
            output_definition: Depolluted appliance fractions and separately managed captured media
            applicability: Supports a specialist-partner and safety gate.
            limitations: No operating instruction or facility approval is provided.
            conflicting_evidence: Actual refrigerant and oil condition require verification.
    component_properties: []
    guided_questions: []
    knowledge_gaps: []
    effective_from: "2026-07-14"
    review_owner: Safety and environmental
