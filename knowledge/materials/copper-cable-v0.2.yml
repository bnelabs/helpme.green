schema_version: "0.2"
kind: materials
cards:
  - id: insulated-copper-cable
    version: 2
    code: COPPER_BEARING
    title: Characterized insulated copper cable
    description: >-
      Evidence-first input profile for segregated cable believed to contain copper conductors.
      The profile remains waste unless a qualified reviewer confirms a lawful alternative status;
      supplier descriptions never establish composition, safety, or product status.
    sources:
      - id: eu-wfd-2025
        source_type: REGULATION
        publisher: European Parliament and Council of the European Union
        title: Directive 2008/98/EC on waste, consolidated 16 October 2025
        url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02008L0098-20251016"
        published_on: "2025-10-16"
        accessed_on: "2026-07-13"
        geography: European Union
        jurisdiction: European Union, including Bulgaria through national implementation
        location_reference: "Regulatory scale: all waste holders and treatment scales in scope; Articles 3, 6, 13, 23 and 35"
        limitations: >-
          Consolidated text is a documentation aid; authentic Official Journal acts and current
          Bulgarian implementation require qualified legal review. It provides no batch composition.
        confidence: HIGH
      - id: eu-copper-eow-715-2013
        source_type: REGULATION
        publisher: European Commission
        title: Regulation (EU) No 715/2013 establishing end-of-waste criteria for copper scrap
        url: "https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX:32013R0715"
        published_on: "2013-07-26"
        accessed_on: "2026-07-13"
        geography: European Union
        jurisdiction: Directly applicable European Union regulation
        location_reference: "Regulatory scale: each copper-scrap consignment; Articles 3 to 5 and Annex I"
        limitations: >-
          Applies only when every criterion, quality-management duty, and statement-of-conformity
          requirement is met. It does not make untreated insulated cable a product.
        confidence: HIGH
      - id: bg-wma-official-2022
        source_type: REGULATION
        publisher: Ministry of Environment and Water of the Republic of Bulgaria
        title: Waste Management Act, official English translation updated through State Gazette 17/2022
        url: "https://www.moew.government.bg/static/media/ups/tiny/Waste_Management_Act.pdf"
        published_on: "2022-03-01"
        accessed_on: "2026-07-13"
        geography: Bulgaria
        jurisdiction: Bulgaria
        location_reference: "Regulatory scale: waste activities in Bulgaria; official English text, Chapters One and Five"
        limitations: >-
          The English translation is not current beyond the amendments listed through March 2022.
          Current Bulgarian text, permits, and site-specific duties must be checked before use.
        confidence: MEDIUM
    input_profile:
      material_family: Segregated insulated cable believed to contain copper conductors
      eligible_forms:
        - Dry cable offcuts segregated by known origin
        - Dismantled insulated cable in a traceable single lot
        - Used cable supported by origin and waste-classification records
      excluded_conditions:
        - Energized or not demonstrably isolated cable
        - Unresolved hazardous properties or unknown origin
        - Oil-filled, jelly-filled, contaminated, or wet cable without specialist acceptance
        - Batteries, sealed components, free liquids, or pressurized items mixed into the lot
        - Mixed aluminium or plated conductors without representative verification
        - Unbounded regulated-substance or persistent-pollutant risk in insulation
      characteristics:
        - key: conductor_material
          description: Representative evidence that the conductor is copper rather than aluminium, plated steel, or an unresolved mixture.
          required_evidence_level: E3
        - key: copper_content_wet_basis
          description: Representative measured copper mass fraction on the declared as-received basis; no default value is supplied.
          required_evidence_level: E3
        - key: cable_type_and_geometry
          description: Cable family, conductor arrangement, diameter distribution, connectors, armour, and fine-wire share relevant to route eligibility.
          required_evidence_level: E2
        - key: insulation_identity
          description: Evidence-backed insulation family and additive-risk status, kept unknown where not tested.
          required_evidence_level: E3
        - key: moisture_and_free_liquids
          description: Representative moisture evidence and confirmation of whether free liquids are present.
          required_evidence_level: E2
        - key: foreign_materials
          description: Representative description of non-cable items, ferrous attachments, plugs, dirt, glass, and other foreign material.
          required_evidence_level: E2
        - key: hazardous_and_waste_status
          description: Reviewed waste code, hazardous-property screen, origin, and any stream-specific treatment obligations.
          required_evidence_level: E3
        - key: verified_input_mass
          description: Traceable as-received lot mass for route comparison and later mass closure.
          required_evidence_level: E2
    effective_from: "2026-07-13"
    review_owner: Material Intelligence lead with qualified environmental reviewer
