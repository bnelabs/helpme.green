schema_version: "0.1"
kind: compliance
cards:
  - id: waste-status
    version: 1
    title: Waste status established
    description: Determine and evidence whether the material is waste before selecting an operational route; draft pending qualified national-law review.
    jurisdiction: EU/Bulgaria
    legal_scope: Waste definition and status under Directive 2008/98/EC and Bulgarian transposition.
    source: {title: Directive 2008/98/EC, url: "https://eur-lex.europa.eu/eli/dir/2008/98/oj", version: "current consolidation must be checked at review"}
    effective_from: "2008-12-12"
    applicability: {exists: batch.origin_country}
    required_evidence: [Supplier declaration, Contract and intended handling, Qualified classification rationale]
    predicate: {exists: batch.waste_status}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified Bulgarian environmental counsel
  - id: proposed-waste-code
    version: 1
    title: Proposed waste code reviewed
    description: Record a reasoned proposed List of Waste code and hazardous mirror-entry assessment; never infer a code from trade name alone.
    jurisdiction: EU/Bulgaria
    legal_scope: EU List of Waste classification and Bulgarian implementation.
    source: {title: Commission Decision 2000/532/EC, url: "https://eur-lex.europa.eu/eli/dec/2000/532/oj", version: "current consolidation must be checked at review"}
    effective_from: "2002-01-01"
    applicability: {equals: [batch.waste_status, WASTE]}
    required_evidence: [Process and origin description, Composition evidence, Mirror-entry assessment where applicable]
    predicate: {exists: batch.proposed_waste_code}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified Bulgarian environmental counsel
  - id: hazardous-status
    version: 1
    title: Hazardous status established
    description: Establish and document hazardous-property status before acceptance, processing, or shipment.
    jurisdiction: EU/Bulgaria
    legal_scope: Hazardous waste classification under Directive 2008/98/EC and Decision 2000/532/EC.
    source: {title: Directive 2008/98/EC, url: "https://eur-lex.europa.eu/eli/dir/2008/98/oj", version: "current consolidation must be checked at review"}
    effective_from: "2008-12-12"
    applicability: {equals: [batch.waste_status, WASTE]}
    required_evidence: [Composition and origin evidence, Hazardous-property assessment, Supporting analysis when required]
    predicate: {exists: batch.hazardous_status}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified environmental and chemical-safety reviewer
  - id: origin-destination
    version: 1
    title: Origin and destination established
    description: Record dispatch, destination, and any transit countries before selecting the applicable shipment procedure.
    jurisdiction: EU and cross-border
    legal_scope: Waste shipment scope and procedure selection.
    source: {title: Regulation (EU) 2024/1157, url: "https://eur-lex.europa.eu/eli/reg/2024/1157/oj", version: "applies from 2026-05-21 with transitional provisions"}
    effective_from: "2026-05-21"
    applicability: {equals: [batch.waste_status, WASTE]}
    required_evidence: [Dispatch country, Destination country, Transit countries if any]
    predicate: {all: [{exists: shipment.origin_country}, {exists: shipment.destination_country}]}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified waste-shipment reviewer
  - id: carrier-receiver-authorization
    version: 1
    title: Carrier and receiver authorization verified
    description: Verify current carrier registration or permit and receiving-facility authorization against the specific waste and operation.
    jurisdiction: EU/Bulgaria and destination country
    legal_scope: Waste collection, transport, recovery, and disposal authorization.
    source: {title: Directive 2008/98/EC Chapter IV, url: "https://eur-lex.europa.eu/eli/dir/2008/98/oj", version: "national registers and transposition must be checked at review"}
    effective_from: "2008-12-12"
    applicability: {equals: [batch.waste_status, WASTE]}
    required_evidence: [Current carrier registration or permit, Current facility permit, Waste-code and operation scope match]
    predicate: {all: [{exists: shipment.carrier_authorization}, {exists: shipment.receiver_authorization}]}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified environmental compliance reviewer
  - id: shipment-documents
    version: 1
    title: Waste shipment documents complete
    description: Select and complete the legally applicable notification, consent, Annex VII, contract, and electronic-information controls before dispatch.
    jurisdiction: EU and cross-border
    legal_scope: Regulation (EU) 2024/1157 shipment documentation and transitional rules.
    source: {title: Regulation (EU) 2024/1157, url: "https://eur-lex.europa.eu/eli/reg/2024/1157/oj", version: "applies from 2026-05-21 with transition and phased provisions"}
    effective_from: "2026-05-21"
    applicability: {equals: [batch.waste_status, WASTE]}
    required_evidence: [Procedure-selection rationale, Required notification or Annex VII information, Required contract, Competent-authority consents where applicable]
    predicate: {exists: shipment.document_pack_complete}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified waste-shipment reviewer
  - id: weee-selective-treatment
    version: 1
    title: WEEE selective-treatment controls established
    description: Confirm removal and controlled treatment of relevant substances, mixtures, and components before a WEEE-derived route is approved.
    jurisdiction: EU/Bulgaria
    legal_scope: Directive 2012/19/EU Article 8 and Annex VII selective treatment.
    source: {title: Directive 2012/19/EU, url: "https://eur-lex.europa.eu/eli/dir/2012/19/oj", version: "current consolidation and Bulgarian transposition must be checked"}
    effective_from: "2012-08-13"
    applicability: {equals: [batch.stream_family, WEEE]}
    required_evidence: [Equipment or component identification, Selective-treatment plan, Authorized specialist capability]
    predicate: {exists: batch.weee_selective_treatment_status}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified WEEE specialist
  - id: pbde-pops-status
    version: 1
    title: PBDE and POPs status reviewed
    description: Obtain material-specific evidence and apply the current Annex IV limits and treatment rules; no concentration threshold is hard-coded in this draft card.
    jurisdiction: EU/Bulgaria
    legal_scope: Regulation (EU) 2019/1021 as amended, including Annex IV waste controls.
    source: {title: Regulation (EU) 2019/1021, url: "https://eur-lex.europa.eu/eli/reg/2019/1021/oj", version: "current consolidation and amendments must be checked at review"}
    effective_from: "2019-07-15"
    applicability: {any: [{equals: [batch.stream_family, WEEE]}, {equals: [batch.material_category, MIXED_POLYMERS]}, {equals: [batch.material_category, PVC_RICH]}]}
    required_evidence: [Origin and age profile, Brominated-flame-retardant risk assessment, Representative analysis where required, Current legal-threshold review]
    predicate: {exists: batch.pops_review_status}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified POPs and chemical compliance specialist
  - id: waste-to-product-intended-use
    version: 1
    title: Waste-to-product intended use demonstrated
    description: Do not make a product or end-of-waste claim without a specific intended use, market, technical specification, legal conformity, and health/environment assessment.
    jurisdiction: EU/Bulgaria
    legal_scope: Directive 2008/98/EC Article 6 and applicable national or EU end-of-waste criteria.
    source: {title: Directive 2008/98/EC Article 6, url: "https://eur-lex.europa.eu/eli/dir/2008/98/oj", version: "current consolidation and applicable criteria must be checked"}
    effective_from: "2008-12-12"
    applicability: {equals: [batch.intended_status, PRODUCT]}
    required_evidence: [Specific intended use, Market or demand evidence, Technical specification, Product-law conformity, Environmental and health assessment]
    predicate: {exists: batch.end_of_waste_approval}
    mandatory: true
    blocking_severity: BLOCK
    review_owner: Qualified environmental and product-law counsel
