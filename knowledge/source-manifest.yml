schema_version: "2"
purpose: >-
  Broad candidate source catalog for local, source-backed circular-economy research. It combines
  scientific, engineering, chemistry, machinery, industry, low-tech, HSE, and regulatory references.
  Fetches are explicit operator actions, stored in a separate local source-download directory and
  runtime SQLite database, and never promote claims automatically. “All relevant sources” is an
  ongoing research program, not a finite completeness claim.
