services:
  helpme-green:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HELPME_ACCESS_TOKEN: ${HELPME_ACCESS_TOKEN:-}
      HELPME_MASTER_KEY: ${HELPME_MASTER_KEY:?set a Fernet key for encrypted BYOK storage}
      HELPME_ROOT: /app
      HELPME_DATA_DIR: /app/.data
      HELPME_AI_ENABLED: ${HELPME_AI_ENABLED:-1}
      HELPME_MODEL: ${HELPME_MODEL:-localai:auto}
      HELPME_MODEL_PROFILES: ${HELPME_MODEL_PROFILES:-}
      HELPME_LOCALAI_BASE_URL: ${HELPME_LOCALAI_BASE_URL:-}
      HELPME_LOCALAI_TLS_VERIFY: ${HELPME_LOCALAI_TLS_VERIFY:-0}
      HELPME_KNOWLEDGE_DB: /app/.data/knowledge.db
      HELPME_SOURCE_DOWNLOAD_DIR: /app/.data/source-downloads
      HELPME_QUALITY_JUDGES: ${HELPME_QUALITY_JUDGES:-1}
      HELPME_EMBEDDING_BASE_URL: ${HELPME_EMBEDDING_BASE_URL:-}
      HELPME_EMBEDDING_MODEL: ${HELPME_EMBEDDING_MODEL:-}
      HELPME_EMBEDDING_API_KEY: ${HELPME_EMBEDDING_API_KEY:-}
      HELPME_EMBEDDING_TLS_VERIFY: ${HELPME_EMBEDDING_TLS_VERIFY:-1}
      HELPME_EMBEDDING_QUERY_ENABLED: ${HELPME_EMBEDDING_QUERY_ENABLED:-0}
      HELPME_RERANK_ENABLED: ${HELPME_RERANK_ENABLED:-0}
      HELPME_RERANK_BASE_URL: ${HELPME_RERANK_BASE_URL:-}
      HELPME_RERANK_MODEL: ${HELPME_RERANK_MODEL:-}
      HELPME_RERANK_API_KEY: ${HELPME_RERANK_API_KEY:-}
      HELPME_RERANK_TLS_VERIFY: ${HELPME_RERANK_TLS_VERIFY:-1}
    volumes:
      - helpme_data:/app/.data

volumes:
  helpme_data:
