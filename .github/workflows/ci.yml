name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,release]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run type checks
        run: python -m mypy src
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

  package:
    name: Build Python distributions
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"
      - name: Validate source version
        shell: bash
        run: python scripts/check_release.py "v$(python -c 'from helpme_green import __version__; print(__version__)')"
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

  container:
    name: Container build and rehearsal
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Linux multi-platform image
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --provenance=false
          --sbom=false
          --output type=oci,dest=/tmp/helpme-green-ci.oci
          .
      - name: Rehearse the local container route
        run: bash scripts/verify_container.sh
